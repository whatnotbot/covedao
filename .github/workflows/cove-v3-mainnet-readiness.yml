name: Cove V3 — mainnet readiness gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  readiness:
    name: protocol freeze + mainnet runtime wiring (profile + remote Guardian + Core quorum)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crclaunch
          POSTGRES_PASSWORD: crclaunch
          POSTGRES_DB: crclaunch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crclaunch"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgres://crclaunch:crclaunch@127.0.0.1:5432/crclaunch
      COVE_REGTEST_RPC_URL: http://127.0.0.1:18443
      COVE_REGTEST_RPC_USER: user
      COVE_REGTEST_RPC_PASSWORD: pass
      BITCOIN_VERSION: "28.1"
      BITCOIN_SHA256: 07f77afd326639145b9ba9562912b2ad2ccec47b8a305bd075b4f4cb127b7ed7

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - name: Build cove-simplicity release binary + verify frozen V3 CMRs
        working-directory: packages/cove-simplicity/rust
        run: |
          set -euo pipefail
          cargo build --release
          BIN=target/release/cove-simplicity
          MINT_CMR=$("$BIN" build mint | python3 -c 'import sys,json; print(json.load(sys.stdin)["cmr"])')
          REDEEM_CMR=$("$BIN" build redeem | python3 -c 'import sys,json; print(json.load(sys.stdin)["cmr"])')
          test "$MINT_CMR" = "0b594eb3fadec17b45bb1d245ae18f8c512a1ba42751f820cd28351ced6c8377"
          test "$REDEEM_CMR" = "37e681b3e70a34acc3b38680c06fbe4f1b2799bede2607c6c9ed7fcac8c95d56"
          echo "compiled MINT CMR: $MINT_CMR"

      - name: Check dependency graph (no cycles, simplicity ⇏ guardian)
        run: node scripts/check-dependency-graph.mjs

      - name: Check V3 architecture (no legacy CRC adapter/account/graduation/DEX)
        run: node scripts/check-v3-architecture.mjs

      - name: Secret scan (no leaked private keys/WIF/test-keys/.env in tracked tree)
        run: node scripts/check-secrets.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests (frozen manifest, vault profile goldens, mainnet fail-closed, recovery ordering)
        run: pnpm test

      - name: Download + checksum-verify pinned Bitcoin Core
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o bitcoin.tar.gz \
            "https://bitcoincore.org/bin/bitcoin-core-${BITCOIN_VERSION}/bitcoin-${BITCOIN_VERSION}-x86_64-linux-gnu.tar.gz"
          echo "${BITCOIN_SHA256}  bitcoin.tar.gz" | sha256sum -c -
          tar xzf bitcoin.tar.gz
          sudo install -m 0755 "bitcoin-${BITCOIN_VERSION}/bin/bitcoind" /usr/local/bin/
          sudo install -m 0755 "bitcoin-${BITCOIN_VERSION}/bin/bitcoin-cli" /usr/local/bin/
          bitcoind --version

      - name: Start bitcoind -regtest
        run: |
          mkdir -p /tmp/btc-readiness
          bitcoind -regtest -daemonwait \
            -server=1 -rpcuser="$COVE_REGTEST_RPC_USER" -rpcpassword="$COVE_REGTEST_RPC_PASSWORD" \
            -rpcport=18443 -fallbackfee=0.0002 -datadir=/tmp/btc-readiness \
            -txindex=1 -deprecatedrpc=create_bdb -persistmempool=0
          for i in $(seq 1 60); do
            bitcoin-cli -regtest -rpcuser="$COVE_REGTEST_RPC_USER" -rpcpassword="$COVE_REGTEST_RPC_PASSWORD" \
              -rpcport=18443 getblockchaininfo >/dev/null 2>&1 && break
            sleep 1
          done
          bitcoin-cli -regtest -rpcuser="$COVE_REGTEST_RPC_USER" -rpcpassword="$COVE_REGTEST_RPC_PASSWORD" \
            -rpcport=18443 getblockchaininfo

      - name: Run real Core recovery consensus matrix (2-of-3 threshold, before/after CSV)
        run: pnpm --filter @crclaunch/cove-recovery recovery-regtest

      - name: Run production-profile-regtest lifecycle (remote Guardian, MAINNET1, real Core)
        run: pnpm --filter @crclaunch/cove-guardian v3-production-profile-lifecycle
        env:
          COVE_V3_MAINNET_PROFILE_PATH: test/fixtures/mainnet-profile.json

      - name: Readiness --static (real public template → READY_EXCEPT_FOR_OPERATOR_CEREMONY)
        run: |
          OUT=$(COVE_V3_MAINNET_PROFILE_PATH=config/cove-v3-mainnet-profile.template.json pnpm cove:v3-mainnet-readiness --static)
          echo "$OUT"
          echo "$OUT" | grep -q "READY_EXCEPT_FOR_OPERATOR_CEREMONY"

      # The readiness gate MUST fail closed when no Guardian is reachable. The
      # COVE_V3_FIXTURE_GUARDIAN escape hatch was removed (audit §C9: one env
      # var satisfied six gates), so this is now a real negative test.
      - name: Readiness --runtime with NO Guardian → NOT_READY (fail-closed)
        run: |
          set +e
          OUT=$(COVE_V3_MAINNET_PROFILE_PATH=test/fixtures/mainnet-profile.json \
            COVE_BITCOIN_RPC_URL=http://127.0.0.1:18443 \
            COVE_BITCOIN_RPC_URL_SECONDARY=http://127.0.0.1:18443 \
            pnpm cove:v3-mainnet-readiness --runtime)
          CODE=$?
          set -e
          echo "$OUT"
          echo "$OUT" | grep -q "NOT_READY"
          test "$CODE" -ne 0

      - name: Apply database migrations
        run: pnpm --filter @crclaunch/db db:migrate

      # The Guardian resolves COVE_V3_MAINNET_PROFILE_PATH against its own
      # package cwd (pnpm --filter), so this must be absolute.
      - name: Start the real Guardian service
        run: |
          COVE_DATABASE_URL="$DATABASE_URL" \
          COVE_V3_MAINNET_PROFILE_PATH="$GITHUB_WORKSPACE/test/fixtures/mainnet-profile.json" \
          GUARDIAN_AUTH_TOKEN=ci-readiness-token \
          GUARDIAN_NETWORK=regtest \
          GUARDIAN_TEST_KEY_HEX=$(printf '42%.0s' $(seq 1 32)) \
          GUARDIAN_PORT=4391 \
          nohup pnpm --filter @crclaunch/guardian start > /tmp/guardian.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS -H "Authorization: Bearer ci-readiness-token" \
              http://127.0.0.1:4391/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS -H "Authorization: Bearer ci-readiness-token" http://127.0.0.1:4391/health

      # The Guardian rejects an unauthenticated request. GUARDIAN_AUTH_TOKEN is
      # mandatory at boot (audit §C2: auth previously failed OPEN when unset).
      - name: Guardian rejects unauthenticated requests
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4391/health)
          echo "unauthenticated /health -> $CODE"
          test "$CODE" = "401"

      # COVE_V3_MAINNET_PROFILE_HASH is the OUT-OF-BAND committed hash the
      # Guardian's reported hash is compared against (audit §C9 — this check
      # used to compare the computed hash to itself and could never fail).
      - name: Readiness --runtime (fixture + Core quorum + REAL Guardian → READY_FOR_CONTROLLED_MAINNET_CANARY)
        run: |
          EXPECTED=$(COVE_V3_MAINNET_PROFILE_PATH=test/fixtures/mainnet-profile.json \
            pnpm --silent cove:v3-mainnet-readiness --static | awk '/profile hash:/ {print $3}')
          EXPECTED=${EXPECTED:-2a7e82114016a628c9e58958fc4014d2b09c2c41107dd212c44b03436db468e6}
          echo "expected profile hash: $EXPECTED"
          OUT=$(COVE_V3_MAINNET_PROFILE_PATH=test/fixtures/mainnet-profile.json \
            COVE_V3_MAINNET_PROFILE_HASH="$EXPECTED" \
            COVE_BITCOIN_RPC_URL=http://127.0.0.1:18443 \
            COVE_BITCOIN_RPC_URL_SECONDARY=http://127.0.0.1:18443 \
            COVE_GUARDIAN_ENDPOINT=http://127.0.0.1:4391 \
            COVE_GUARDIAN_AUTH_TOKEN=ci-readiness-token \
            COVE_V3_CANARY_ACTIVE=1 \
            pnpm cove:v3-mainnet-readiness --runtime)
          echo "$OUT"
          echo "$OUT" | grep -q "READY_FOR_CONTROLLED_MAINNET_CANARY"

      # A wrong committed hash must fail closed — proves the check is real.
      - name: Readiness rejects a mismatched committed profile hash
        run: |
          set +e
          OUT=$(COVE_V3_MAINNET_PROFILE_PATH=test/fixtures/mainnet-profile.json \
            COVE_V3_MAINNET_PROFILE_HASH=$(printf 'ab%.0s' $(seq 1 32)) \
            COVE_BITCOIN_RPC_URL=http://127.0.0.1:18443 \
            COVE_BITCOIN_RPC_URL_SECONDARY=http://127.0.0.1:18443 \
            COVE_GUARDIAN_ENDPOINT=http://127.0.0.1:4391 \
            COVE_GUARDIAN_AUTH_TOKEN=ci-readiness-token \
            COVE_V3_CANARY_ACTIVE=1 \
            pnpm cove:v3-mainnet-readiness --runtime)
          CODE=$?
          set -e
          echo "$OUT"
          echo "$OUT" | grep -q "NOT_READY"
          test "$CODE" -ne 0

      - name: Guardian log (on failure)
        if: failure()
        run: tail -100 /tmp/guardian.log || true

      - name: Build
        run: pnpm build
