name: Cove V3 full lifecycle (real Bitcoin Core regtest)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  v3-lifecycle:
    name: DEPLOY→MINT→TRANSFER→REDEEM→RE-BUY→P2P→reorg on unmodified bitcoind
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      COVE_REGTEST_RPC_URL: http://127.0.0.1:18443
      COVE_REGTEST_RPC_USER: user
      COVE_REGTEST_RPC_PASSWORD: pass
      BITCOIN_VERSION: "28.1"
      BITCOIN_SHA256: 07f77afd326639145b9ba9562912b2ad2ccec47b8a305bd075b4f4cb127b7ed7

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Simplicity is built BEFORE the lifecycle runs. If the Rust build or CMR
      # verification fails, the lifecycle (which invokes the binary with no skip
      # and no TS-only fallback) fails — the intended signal.
      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build cove-simplicity release binary + verify frozen V3 CMRs
        working-directory: packages/cove-simplicity/rust
        run: |
          set -euo pipefail
          cargo build --release
          BIN=target/release/cove-simplicity
          MINT_CMR=$("$BIN" build mint | python3 -c 'import sys,json; print(json.load(sys.stdin)["cmr"])')
          REDEEM_CMR=$("$BIN" build redeem | python3 -c 'import sys,json; print(json.load(sys.stdin)["cmr"])')
          test "$MINT_CMR" = "ccdb02000fdb372bfa2e166b9fe0192715d555fc5720f8008ee741fe1a0d58ec"
          test "$REDEEM_CMR" = "37e681b3e70a34acc3b38680c06fbe4f1b2799bede2607c6c9ed7fcac8c95d56"
          echo "compiled MINT CMR: $MINT_CMR"
          echo "compiled REDEEM CMR: $REDEEM_CMR"

      - name: Download + checksum-verify pinned Bitcoin Core
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o bitcoin.tar.gz \
            "https://bitcoincore.org/bin/bitcoin-core-${BITCOIN_VERSION}/bitcoin-${BITCOIN_VERSION}-x86_64-linux-gnu.tar.gz"
          echo "${BITCOIN_SHA256}  bitcoin.tar.gz" | sha256sum -c -
          tar xzf bitcoin.tar.gz
          sudo install -m 0755 "bitcoin-${BITCOIN_VERSION}/bin/bitcoind" /usr/local/bin/
          sudo install -m 0755 "bitcoin-${BITCOIN_VERSION}/bin/bitcoin-cli" /usr/local/bin/
          bitcoind --version

      - name: Start bitcoind -regtest
        run: |
          mkdir -p /tmp/btc-v3
          bitcoind -regtest -daemonwait \
            -server=1 -rpcuser="$COVE_REGTEST_RPC_USER" -rpcpassword="$COVE_REGTEST_RPC_PASSWORD" \
            -rpcport=18443 -fallbackfee=0.0002 -datadir=/tmp/btc-v3 \
            -txindex=1 -deprecatedrpc=create_bdb -persistmempool=0
          for i in $(seq 1 60); do
            bitcoin-cli -regtest -rpcuser="$COVE_REGTEST_RPC_USER" -rpcpassword="$COVE_REGTEST_RPC_PASSWORD" \
              -rpcport=18443 getblockchaininfo >/dev/null 2>&1 && break
            sleep 1
          done
          bitcoin-cli -regtest -rpcuser="$COVE_REGTEST_RPC_USER" -rpcpassword="$COVE_REGTEST_RPC_PASSWORD" \
            -rpcport=18443 getblockchaininfo

      # The harness throws (non-zero exit) if Core is unreachable or any step is
      # rejected — it does NOT skip. A red CI run is the intended signal.
      - name: Run full V3 lifecycle (fails, not skips, if Core unreachable)
        run: pnpm cove:v3-regtest-lifecycle

      # Production-profile lifecycle: the SAME journey under the MAINNET1 2-of-3
      # recovery profile + durable-before-sign Guardian boundary (audit chain +
      # signing journal + risk caps). Proves §137/§145 end-to-end.
      - name: Run MAINNET1 production-profile lifecycle (durable signer)
        run: pnpm cove:v3-mainnet-profile-lifecycle

      - name: Dump bitcoind debug log (on failure)
        if: failure()
        run: tail -80 /tmp/btc-v3/regtest/debug.log
