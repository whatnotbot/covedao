openapi: 3.0.3
info:
  title: CRC Canonical API (proposed)
  version: 0.1.0
  description: |
    Proposed API surface that CRC Launch needs from the canonical CRC
    Oracle/indexer. This is a PROPOSED contract for the CRC team — it is not
    the current CRC API. The reference implementation is the mock service in
    apps/mock-crc-service. Fields with bigint are serialized as decimal strings.
servers:
  - url: http://localhost:4390
    description: Mock canonical CRC service (reference shape only)
paths:
  /capabilities:
    get:
      summary: Negotiate supported features
      responses:
        "200":
          description: Capability flags
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CRCCapabilities"
  /deploy/authorize:
    post:
      summary: Request authorization to deploy a token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticker, name, creatorAddress]
              properties:
                ticker: { type: string }
                name: { type: string }
                profile: { type: string, description: "e.g. crc-launch-v1" }
                creatorAddress: { type: string }
      responses:
        "200":
          description: Authorization decision
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorized: { type: boolean }
                  deploymentId: { type: string }
                  expiresAt: { type: string, format: date-time }
                  reason: { type: string }
  /mint/authorize:
    post:
      summary: Request authorization to mint, with required payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deploymentId, walletAddress, requestedAmountAtoms]
              properties:
                deploymentId: { type: string }
                walletAddress: { type: string }
                requestedAmountAtoms: { type: string }
      responses:
        "200":
          description: Authorization decision and canonical quote
          content:
            application/json:
              schema:
                type: object
                properties:
                  authorized: { type: boolean }
                  authorizationId: { type: string }
                  requiredPaymentSats: { type: string }
                  tokenAmountAtoms: { type: string }
                  startingStage: { type: integer }
                  endingStage: { type: integer }
                  supplyBeforeAtoms: { type: string }
                  supplyAfterAtoms: { type: string }
                  expiresAt: { type: string, format: date-time }
                  reason: { type: string }
  /operation/submit:
    post:
      summary: Submit a signed operation for canonical settlement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation, walletAddress, signedTransactionHex]
              properties:
                operation: { type: string, enum: [deploy, mint, transfer, list, buy, cancel] }
                walletAddress: { type: string }
                signedTransactionHex: { type: string }
                deploymentId: { type: string }
                authorizationId: { type: string }
      responses:
        "200":
          description: Submission result
          content:
            application/json:
              schema:
                type: object
                properties:
                  operationId: { type: string }
                  status: { type: string, enum: [submitted, accepted, rejected] }
                  reason: { type: string }
  /tokens/{deploymentId}:
    get:
      summary: Canonical token state
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Canonical state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalTokenState"
  /operations/{operationId}:
    get:
      summary: Operation status
      parameters:
        - name: operationId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Operation status
          content:
            application/json:
              schema:
                type: object
                properties:
                  operationId: { type: string }
                  status: { type: string, enum: [pending, accepted, rejected, finalized] }
                  txid: { type: string }
                  blockHeight: { type: string }
                  reason: { type: string }
  /activity:
    get:
      summary: Canonical activity page (cursor paginated)
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Activity page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        txid: { type: string }
                        blockHeight: { type: string }
                        type: { type: string }
                        ticker: { type: string }
                        amountAtoms: { type: string }
                        btcSats: { type: string }
                        timestamp: { type: string, format: date-time }
                  nextCursor: { type: ["string", "null"] }
components:
  schemas:
    CRCCapabilities:
      type: object
      properties:
        arbitraryDeploy: { type: boolean }
        progressiveMint: { type: boolean }
        customSupply: { type: boolean }
        oracleAuthorization: { type: boolean }
        canonicalBalanceQuery: { type: boolean }
        transfer: { type: boolean }
        marketplace: { type: boolean }
        graduation: { type: boolean }
        vault: { type: boolean }
    CanonicalTokenState:
      type: object
      properties:
        deploymentId: { type: string }
        ticker: { type: string }
        status: { type: string }
        totalSupplyAtoms: { type: string }
        confirmedMintedAtoms: { type: string }
        remainingPublicSupplyAtoms: { type: string }
        currentStage: { type: integer }
        reserveSats: { type: string }
        stateHash: { type: string }
